- period: 2001–2009
  theme: Engineer
  description: Computer-vision engineer in Copenhagen, early engineer at SparkNotes as it scaled to ~10M users, then engineer and engineering director at Cake & Arrow in New York.

- period: 2010–2016
  theme: CTO and head of engineering
  description: Founding engineer and CTO at Samasource, building one of the earliest human-in-the-loop data annotation platforms for machine learning and helping open its Nairobi office. Then head of engineering at FWD.us.

- period: 2017–2021
  theme: Public interest and health
  description: Lecturer at UC Berkeley Haas. Founding core team at U.S. Digital Response during COVID-19, leading engineering for Project N95. Head of engineering at Antara Health in Nairobi, then director of engineering at Cityblock Health.

- period: 2023–now
  theme: Building with AI
  description: Back to hands-on AI work at South Park Commons, advising UNDP and the African Development Bank on AI across Africa, and building Ylab's open evaluations.
