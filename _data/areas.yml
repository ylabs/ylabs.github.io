- id: health
  title: Community and primary health
  description: Frontline health workers make high-stakes decisions with little support. We test whether AI can help them follow national clinical guidelines safely, starting with hypertension and diabetes care in Kenya.

- id: public-services
  title: Public services
  description: Governments are under pressure to adopt AI quickly. We help them decide where it fits, what evidence to ask for, and how to keep a human accountable for the outcome.

- id: development
  title: Global development
  description: Most AI evaluation happens in English and in rich-country settings. We build evaluations in the languages and contexts where development programs actually run, starting in East Africa.
